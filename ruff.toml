line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "PLC0415"]
ignore = ["E501"]

[lint.per-file-ignores]
"llmhole/challenges/__init__.py" = ["F401"]
# Tests import inside test bodies on purpose, to keep a case self-contained and
# to import a module only after monkeypatching its environment.
"tests/*" = ["B011", "PLC0415"]
