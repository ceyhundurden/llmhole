name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; jobs opt into more only if they need it.
permissions:
  contents: read

jobs:
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      # NOTE: for supply-chain hardening, pin these actions to commit SHAs.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  audit:
    name: Dependency & secret audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Dependency CVEs and image vulns are the real risk surface here - the app
      # layer is vulnerable *on purpose*, so these matter more than usual.
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt
      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v3
        continue-on-error: true

  sast:
    name: Static analysis (advisory)
    runs-on: ubuntu-latest
    # The intentional lessons will trip SAST by design, so this job is advisory.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: bandit
        run: |
          pip install bandit
          bandit -r aisec -x aisec/challenges,aisec/levels,aisec/engine

  image:
    name: Build image & scan (Trivy)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t aisec-lab:ci .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aisec-lab:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
